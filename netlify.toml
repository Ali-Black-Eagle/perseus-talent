# Netlify build settings for Perseus Talent.
# The Next.js runtime is listed explicitly: Netlify only adds it automatically for Git-linked builds,
# not for deploys uploaded from the command line or API.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Node 22 is a long-term-support release that Netlify supports.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# --- Domain (SEO) ---
# The one official address is https://perseustalent.co.uk (no www). It is set as the PRIMARY domain in
# Netlify > Domain management, and Netlify itself redirects www and http to it. Do not add host redirects
# here: a rule that disagrees with the primary-domain setting causes an endless redirect loop.
