<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A0B42"/>
      <stop offset="100%" stop-color="#1C052E"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B577"/>
      <stop offset="100%" stop-color="#A8853F"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFE8F4"/>
    </linearGradient>
  </defs>

  <!-- Architectural Background: Clinical Suite -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Clinical Architecture Lines -->
  <g stroke="#C5A15B" stroke-width="0.75" stroke-opacity="0.25">
    <line x1="120" y1="0" x2="120" y2="600"/>
    <line x1="680" y1="0" x2="680" y2="600"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
  </g>

  <!-- Soft Ambient Glow -->
  <circle cx="400" cy="260" r="220" fill="#3B1A57" opacity="0.6"/>
  <circle cx="400" cy="240" r="140" fill="#5A3A78" opacity="0.4"/>

  <!-- Gold 8-Point Star Accents in Background -->
  <g fill="#C5A15B" opacity="0.4">
    <path d="M640 100L643 108L651 111L643 114L640 122L637 114L629 111L637 108Z"/>
    <path d="M160 320L162 326L168 328L162 330L160 336L158 330L152 328L158 326Z"/>
  </g>

  <!-- Professional Figure Silhouette / Stylised Healthcare Clinician -->
  <g transform="translate(400, 310)">
    <!-- Shoulders & Clinical Coat -->
    <path d="M-180 290 C-180 180 -120 120 -60 110 L-20 220 L20 220 L60 110 C120 120 180 180 180 290 Z" fill="url(#coatGrad)"/>
    
    <!-- Scrub V-Neck -->
    <path d="M-40 110 L0 180 L40 110 Z" fill="#2A0B42"/>
    <path d="M-30 110 L0 165 L30 110 Z" fill="#5A3A78"/>

    <!-- Stethoscope Graphic -->
    <path d="M-35 125 C-50 170 -40 230 -15 250 C10 270 45 220 35 125" fill="none" stroke="#C5A15B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-15" cy="250" r="10" fill="#C5A15B"/>
    <circle cx="-15" cy="250" r="6" fill="#1C052E"/>

    <!-- Head & Posture -->
    <circle cx="0" cy="20" r="65" fill="#E6E0EB"/>
    <!-- Sleek professional hair contour -->
    <path d="M-65 20 C-65 -45 -30 -60 0 -60 C30 -60 65 -45 65 20 C50 0 30 -30 0 -30 C-30 -30 -50 0 -65 20 Z" fill="#1C052E"/>

    <!-- Lanyard with ID Badge -->
    <path d="M-15 150 L-10 260 L10 260 L15 150" fill="none" stroke="#A8853F" stroke-width="2"/>
    <rect x="-24" y="260" width="48" height="30" rx="3" fill="#FFFFFF" stroke="#C5A15B" stroke-width="1.5"/>
    <rect x="-18" y="268" width="36" height="4" rx="2" fill="#1C052E"/>
    <rect x="-18" y="276" width="24" height="3" rx="1.5" fill="#C5A15B"/>
  </g>

  <!-- Foreground Elegant Frame Accent -->
  <rect x="20" y="20" width="760" height="560" rx="2" fill="none" stroke="#C5A15B" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="28" y="28" width="744" height="544" rx="2" fill="none" stroke="#C5A15B" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Caption Plaque -->
  <rect x="50" y="520" width="260" height="36" rx="2" fill="#1C052E" stroke="#C5A15B" stroke-width="1"/>
  <text x="65" y="543" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" letter-spacing="0.16em" fill="#C5A15B">CLINICAL EXCELLENCE</text>
</svg>
