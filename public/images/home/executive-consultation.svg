<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="execBg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C052E"/>
      <stop offset="50%" stop-color="#2A0B42"/>
      <stop offset="100%" stop-color="#1C052E"/>
    </linearGradient>
    <linearGradient id="goldLines" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B577"/>
      <stop offset="100%" stop-color="#7A5A20"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#execBg)"/>

  <!-- Architectural Boardroom / Panoramic Window Grid -->
  <g stroke="#C5A15B" stroke-width="0.75" stroke-opacity="0.2">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Constellation Ambient Watermark in Window -->
  <g stroke="#C5A15B" stroke-width="0.7" stroke-opacity="0.35">
    <line x1="260" y1="180" x2="310" y2="120"/>
    <line x1="260" y1="180" x2="210" y2="240"/>
    <line x1="210" y1="240" x2="160" y2="300"/>
    <line x1="260" y1="180" x2="330" y2="230"/>
    <line x1="330" y1="230" x2="370" y2="320"/>
    <circle cx="260" cy="180" r="3" fill="#FFFFFF"/>
    <circle cx="210" cy="240" r="2.5" fill="#C5A15B"/>
    <circle cx="310" cy="120" r="2.5" fill="#C5A15B"/>
    <circle cx="160" cy="300" r="2" fill="#C5A15B"/>
    <circle cx="370" cy="320" r="2.5" fill="#C5A15B"/>
  </g>

  <!-- Consultation Table & Two Figures in Strategic Discussion -->
  <!-- Table surface -->
  <ellipse cx="400" cy="520" rx="360" ry="90" fill="#2A0B42" stroke="#C5A15B" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="400" cy="530" rx="330" ry="70" fill="#1C052E"/>

  <!-- Left Figure: Executive Hiring Manager / Client -->
  <g transform="translate(240, 360)">
    <!-- Body & Suit Jacket -->
    <path d="M-100 240 C-100 150 -60 100 0 90 C60 100 100 150 100 240 Z" fill="#3B1A57"/>
    <!-- Shirt & Tie -->
    <path d="M-25 90 L0 160 L25 90 Z" fill="#FFFFFF"/>
    <path d="M-8 100 L0 180 L8 100 Z" fill="#C5A15B"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="50" fill="#E6E0EB"/>
    <path d="M-50 15 C-50 -35 -20 -45 0 -45 C20 -45 50 -35 50 15 C35 0 20 -20 0 -20 C-20 -20 -35 0 -50 15 Z" fill="#1C052E"/>
    <!-- Briefing Portfolio on Table -->
    <rect x="50" y="110" width="70" height="50" rx="2" transform="rotate(-15)" fill="#FBF9F6" stroke="#C5A15B" stroke-width="1"/>
  </g>

  <!-- Right Figure: Perseus Talent Consultant / Advisor -->
  <g transform="translate(560, 360)">
    <!-- Body & Blazer -->
    <path d="M-100 240 C-100 150 -60 100 0 90 C60 100 100 150 100 240 Z" fill="#2A0B42"/>
    <!-- Inner Silk Top -->
    <path d="M-30 90 L0 150 L30 90 Z" fill="#D4B577"/>
    <!-- Head -->
    <circle cx="0" cy="15" r="50" fill="#EFE8F4"/>
    <path d="M-50 15 C-50 -35 -20 -45 0 -45 C20 -45 50 -35 50 15 C35 0 20 -20 0 -20 C-20 -20 -35 0 -50 15 Z" fill="#1C052E"/>
    <!-- Digital Briefing Tablet -->
    <rect x="-90" y="105" width="60" height="42" rx="3" transform="rotate(10)" fill="#1C052E" stroke="#C5A15B" stroke-width="1.5"/>
  </g>

  <!-- Frame & Border Accents -->
  <rect x="20" y="20" width="760" height="560" rx="2" fill="none" stroke="#C5A15B" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="28" y="28" width="744" height="544" rx="2" fill="none" stroke="#C5A15B" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Plaque -->
  <rect x="50" y="520" width="280" height="36" rx="2" fill="#1C052E" stroke="#C5A15B" stroke-width="1"/>
  <text x="65" y="543" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" letter-spacing="0.16em" fill="#C5A15B">STRATEGIC APPOINTMENTS</text>
</svg>
