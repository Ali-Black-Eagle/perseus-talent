<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clinicBg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C052E"/>
      <stop offset="60%" stop-color="#2A0B42"/>
      <stop offset="100%" stop-color="#1C052E"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C5A15B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C5A15B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#clinicBg)"/>

  <!-- Clinical Architecture & Modern Healthcare Setting -->
  <g stroke="#C5A15B" stroke-width="0.75" stroke-opacity="0.2">
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Central Surgical / Clinical Pendant Light Ring -->
  <circle cx="600" cy="300" r="180" fill="none" stroke="#C5A15B" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="600" cy="300" r="140" fill="none" stroke="#C5A15B" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="600" cy="300" r="80" fill="#3B1A57" opacity="0.6"/>
  <circle cx="600" cy="300" r="6" fill="#FFFFFF"/>

  <!-- Light cone downwards -->
  <polygon points="460,300 740,300 860,700 340,700" fill="url(#glowGrad)"/>

  <!-- Clinical Team in Multidisciplinary Consultation -->
  <!-- Clinician 1 -->
  <g transform="translate(480, 520)">
    <path d="M-70 180 C-70 110 -40 70 0 65 C40 70 70 110 70 180 Z" fill="#EFE8F4"/>
    <circle cx="0" cy="15" r="38" fill="#FFFFFF"/>
    <path d="M-38 15 C-38 -25 -15 -35 0 -35 C15 -35 38 -25 38 15 Z" fill="#1C052E"/>
    <circle cx="0" cy="95" r="6" fill="#C5A15B"/>
  </g>

  <!-- Clinician 2 (Leading discussion) -->
  <g transform="translate(620, 500)">
    <path d="M-80 200 C-80 120 -45 80 0 75 C45 80 80 120 80 200 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="20" r="42" fill="#E6E0EB"/>
    <path d="M-42 20 C-42 -25 -15 -38 0 -38 C15 -38 42 -25 42 20 Z" fill="#2A0B42"/>
    <!-- Stethoscope -->
    <path d="M-25 90 C-35 125 -30 160 -10 170 C10 180 35 150 25 90" fill="none" stroke="#C5A15B" stroke-width="3"/>
  </g>

  <!-- Clinician 3 -->
  <g transform="translate(750, 530)">
    <path d="M-70 170 C-70 100 -40 65 0 60 C40 65 70 100 70 170 Z" fill="#EFE8F4"/>
    <circle cx="0" cy="12" r="36" fill="#FFFFFF"/>
    <path d="M-36 12 C-36 -25 -15 -32 0 -32 C15 -32 36 -25 36 12 Z" fill="#1C052E"/>
  </g>

  <!-- Constellation guide overlay -->
  <g stroke="#C5A15B" stroke-width="0.8" stroke-opacity="0.35">
    <line x1="880" y1="140" x2="940" y2="100"/>
    <line x1="940" y1="100" x2="1020" y2="130"/>
    <circle cx="880" cy="140" r="3" fill="#C5A15B"/>
    <circle cx="940" cy="100" r="3.5" fill="#FFFFFF"/>
    <circle cx="1020" cy="130" r="2.5" fill="#C5A15B"/>
  </g>

  <!-- Borders -->
  <rect x="24" y="24" width="1152" height="752" rx="2" fill="none" stroke="#C5A15B" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="36" y="36" width="1128" height="728" rx="2" fill="none" stroke="#C5A15B" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Plaque -->
  <rect x="60" y="700" width="340" height="42" rx="2" fill="#1C052E" stroke="#C5A15B" stroke-width="1"/>
  <text x="80" y="726" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" letter-spacing="0.18em" fill="#C5A15B">PRIMARY HEALTHCARE SPECIALISM</text>
</svg>
